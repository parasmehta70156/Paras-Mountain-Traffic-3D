name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.2.stable
          unzip -q Godot_v4.5.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.2.stable/

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Export signed APK
        run: |
          mkdir -p build
          $GITHUB_WORKSPACE/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Paras-Mountain-Traffic-3D.apk

      - name: Verify APK
        run: |
          test -s build/Paras-Mountain-Traffic-3D.apk
          ls -lh build/Paras-Mountain-Traffic-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paras-Mountain-Traffic-3D-APK
          path: build/Paras-Mountain-Traffic-3D.apk
