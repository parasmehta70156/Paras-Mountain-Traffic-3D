name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot 4.5.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          unzip -q Godot_v4.5.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '[resource]' "export/android/android_sdk_path = \"$ANDROID_HOME\"" "export/android/java_sdk_path = \"$JAVA_HOME\"" > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore paras-debug.keystore -alias paras -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Paras Mountain Traffic 3D, O=Paras"

      - name: Export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/paras-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: paras
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          ./godot --headless --path . --editor --quit
          ./godot --headless --path . --export-debug "Android" Paras-Mountain-Traffic-3D.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Paras-Mountain-Traffic-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paras-Mountain-Traffic-3D-APK
          path: Paras-Mountain-Traffic-3D.apk
          if-no-files-found: error
