name: Cartoon Road Racer Android APK

on:
  push:
    branches: [main]
    paths:
      - 'CartoonRoadRacer/**'
      - '.github/workflows/cartoon-road-racer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
      - name: Check Godot version and Android export templates
        run: |
          godot --version
          mkdir -p ~/.config/godot
          mkdir -p build
      - name: Import game
        run: godot --headless --editor --path CartoonRoadRacer --quit
      - name: Export Android APK
        run: godot --headless --path CartoonRoadRacer --export-debug "Android" build/CartoonRoadRacer.apk
      - name: Verify APK exists and is non-empty
        run: |
          test -s build/CartoonRoadRacer.apk
          file build/CartoonRoadRacer.apk
          ls -lh build/CartoonRoadRacer.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonRoadRacer-Android-APK
          path: build/CartoonRoadRacer.apk
          if-no-files-found: error
          retention-days: 14
