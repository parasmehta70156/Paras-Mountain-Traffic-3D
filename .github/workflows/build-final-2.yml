name: Final APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.5.2.stable/
      - name: Configure Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64"
          export/android/sdk_path = "/usr/local/lib/android/sdk"
          EOF
      - name: Fix GDScript type inference
        run: |
          sed -i 's/var rail_x := x + side \* 6.0/var rail_x: float = x + side * 6.0/' dangerous_game.gd
          sed -i 's/var lane_offset := LANES\[traffic_lane\[i\]\]/var lane_offset: float = LANES[traffic_lane[i]]/' dangerous_game.gd
      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1
          export_path=""

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          package/unique_name="com.parasmehta.mountaintraffic3d"
          package/name="Paras Mountain Traffic 3D"
          package/signed=true
          package/app_category=0
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_launcher=true
          version/code=1
          version/name="1.0"
          screen/immersive_mode=true
          screen/orientation=1
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          architecture/armeabi-v7a=false
          architecture/arm64-v8a=true
          architecture/x86=false
          architecture/x86_64=false
          permissions/internet=false
          EOF
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/Paras-Mountain-Traffic-3D.apk
          test -s build/Paras-Mountain-Traffic-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Paras-Mountain-Traffic-3D-FINAL-APK
          path: build/Paras-Mountain-Traffic-3D.apk
